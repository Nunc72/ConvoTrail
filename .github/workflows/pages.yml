name: Deploy Pages

# The default "Deploy from a branch" pipeline got stuck building forever
# on 26 May 2026 — three commits in a row sat in "building" status with
# no error message and no progress. Switching the Pages source to "GitHub
# Actions" and running an explicit Static-HTML deploy avoids that pipeline
# entirely and gives us visible logs in the Actions tab.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Precompiles index.html's JSX (same Babel the browser used to run),
      # Tailwind and React-production into _site/, so visitors no longer
      # download Babel and compile ~560 KB of JSX on every start. Any
      # surprise fails the build and the live site stays as it was.
      - name: Build site
        run: |
          npm ci
          npm run build:pages
      - uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
